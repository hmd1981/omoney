<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="routeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dec58d" stop-opacity="0"/>
      <stop offset="45%" stop-color="#c7a15b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dec58d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g opacity="0.35" stroke="url(#routeGold)" stroke-width="1.2" filter="url(#glow)">
    <path d="M220 420 Q520 280 720 360 T1120 320" class="route-animate"/>
    <path d="M180 520 Q480 440 680 500 T1180 460" opacity="0.6"/>
    <path d="M320 300 Q600 380 820 340 T1280 280" opacity="0.45"/>
    <path d="M400 600 Q700 520 900 560 T1300 500" opacity="0.35"/>
  </g>
  <g fill="#dec58d" opacity="0.7">
    <circle cx="220" cy="420" r="3"/><circle cx="720" cy="360" r="3"/>
    <circle cx="1120" cy="320" r="3"/><circle cx="680" cy="500" r="2.5"/>
    <circle cx="1180" cy="460" r="2.5"/><circle cx="900" cy="560" r="2"/>
  </g>
</svg>
